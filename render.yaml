databases:
  - name: educore-db
    databaseName: educore
    user: educore
    postgresMajorVersion: "16"
    plan: basic-256mb
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: educore-api
    runtime: docker
    rootDir: DEV/EDUCORE/backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health/
    disk:
      name: educore-profile-media
      mountPath: /var/data/media
      sizeGB: 1
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: educore-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: educore-frontend
          property: host
      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: educore-frontend
          property: host
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SECURE_SSL_REDIRECT
        value: "True"

  - type: web
    name: educore-frontend
    runtime: static
    rootDir: DEV/EDUCORE/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    region: frankfurt
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: educore-api
          property: host
